# Free Supabase projects pause after a week without activity, which would stop
# the waitlist sign-ups. This asks the database for nothing much every 3 days.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the waitlist database
        run: |
          # A real query that row security answers with nothing: enough to count
          # as activity, and the publishable key (already in the page) can't read anything.
          curl --fail --silent --show-error --output /dev/null \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqa2V2ZnJ3eG5iZHdoeXZyZGl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTYxMDMsImV4cCI6MjEwMTY5MjEwM30.zBrxC6fotUj_4pAVBZ_6PrhSdOP0eX16Y5o7-0MB0eo" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFqa2V2ZnJ3eG5iZHdoeXZyZGl5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxMTYxMDMsImV4cCI6MjEwMTY5MjEwM30.zBrxC6fotUj_4pAVBZ_6PrhSdOP0eX16Y5o7-0MB0eo" \
            "https://ajkevfrwxnbdwhyvrdiy.supabase.co/rest/v1/athlete?select=id&limit=1"
